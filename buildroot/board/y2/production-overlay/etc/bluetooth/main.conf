[General]
Name=Y2Linux
# Audio/Video major class, Portable Audio minor class: headsets and car units
# show a music player instead of "Miscellaneous" (Beta 1 reported 0x080000).
Class=0x00041C
DiscoverableTimeout=180
PairableTimeout=180
ControllerMode=dual
# Controller reports BR/EDR/LE features; no release-wide packet-mode restriction.
[Policy]
AutoEnable=false
# y2-bt-reconnect owns preferred audio-peer retries through Device1. Keeping
# the upstream retry loop off avoids two independent connection policies.
ReconnectAttempts=0
ReconnectIntervals=1,2,4,8,16,32,64
ResumeDelay=3
